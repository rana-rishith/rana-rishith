<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 190" width="820" height="190" role="img" aria-label="Studying: B.Tech IT, 3rd year, Manipal University Jaipur. Next: MS in AI/ML, Fall 2028.">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
      .label { fill: #D97757; font-size: 13px; font-weight: 700; letter-spacing: 3px; }
      .big { fill: #f5f5f5; font-size: 22px; font-weight: 700; }
      .small { fill: #9aa4b2; font-size: 14px; }
      .tiny { fill: #5f6b7a; font-size: 11px; letter-spacing: 2px; }
    </style>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9B2C2C"/>
      <stop offset="0.6" stop-color="#D97757"/>
      <stop offset="1" stop-color="#FFC14D"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.025"/>
    </pattern>
    <filter id="neon" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="type1"><rect x="40" y="70" height="40" width="0"><animate attributeName="width" values="0;340;340" keyTimes="0;0.3;1" dur="6s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="type2"><rect x="460" y="70" height="40" width="0"><animate attributeName="width" values="0;0;340;340" keyTimes="0;0.15;0.45;1" dur="6s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <!-- ===== STUDYING ===== -->
  <g>
    <rect x="10" y="10" width="390" height="170" rx="10" fill="url(#panel)"/>
    <rect x="10" y="10" width="390" height="170" rx="10" fill="url(#scan)"/>
    <rect x="10" y="10" width="390" height="170" rx="10" fill="none" stroke="#D97757" stroke-opacity="0.55" stroke-width="1.5" filter="url(#neon)">
      <animate attributeName="stroke-opacity" values="0.35;0.8;0.35" dur="3s" repeatCount="indefinite"/>
    </rect>
    <!-- corner brackets -->
    <path d="M10 34 V10 H34 M376 10 H400 V34 M400 156 V180 H376 M34 180 H10 V156" fill="none" stroke="#FFC14D" stroke-width="2.5"/>

    <circle cx="44" cy="44" r="5" fill="#3fb950"><animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="58" y="49" class="mono label">STUDYING</text>
    <text x="388" y="49" class="mono tiny" text-anchor="end">SYS.EDU // ONLINE</text>

    <g clip-path="url(#type1)">
      <text x="40" y="98" class="mono big">&gt; B.Tech IT · Year 3</text>
    </g>
    <rect x="40" y="80" width="11" height="22" fill="#D97757">
      <animate attributeName="x" values="40;312;312" keyTimes="0;0.3;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <text x="40" y="128" class="mono small">Manipal University Jaipur</text>

    <text x="40" y="160" class="mono tiny">PROGRESS</text>
    <rect x="128" y="151" width="196" height="10" rx="2" fill="#21262d"/>
    <rect x="128" y="151" width="0" height="10" rx="2" fill="url(#bar)">
      <animate attributeName="width" values="0;122;122" keyTimes="0;0.4;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="388" y="160" class="mono tiny" text-anchor="end" fill="#D97757">YR 3/4</text>
  </g>

  <!-- ===== NEXT ===== -->
  <g>
    <rect x="420" y="10" width="390" height="170" rx="10" fill="url(#panel)"/>
    <rect x="420" y="10" width="390" height="170" rx="10" fill="url(#scan)"/>
    <rect x="420" y="10" width="390" height="170" rx="10" fill="none" stroke="#D97757" stroke-opacity="0.55" stroke-width="1.5" filter="url(#neon)">
      <animate attributeName="stroke-opacity" values="0.8;0.35;0.8" dur="3s" repeatCount="indefinite"/>
    </rect>
    <path d="M420 34 V10 H444 M786 10 H810 V34 M810 156 V180 H786 M444 180 H420 V156" fill="none" stroke="#FFC14D" stroke-width="2.5"/>

    <circle cx="454" cy="44" r="5" fill="#FFC14D"><animate attributeName="opacity" values="1;0.25;1" dur="1.1s" repeatCount="indefinite"/></circle>
    <text x="468" y="49" class="mono label">NEXT</text>
    <text x="798" y="49" class="mono tiny" text-anchor="end">TARGET // LOCKED</text>

    <g clip-path="url(#type2)">
      <text x="460" y="98" class="mono big">&gt; MS in AI/ML</text>
    </g>
    <rect x="460" y="80" width="11" height="22" fill="#D97757">
      <animate attributeName="x" values="460;460;640;640" keyTimes="0;0.15;0.45;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <text x="460" y="128" class="mono small">Launch window: Fall 2028</text>

    <text x="460" y="160" class="mono tiny">LOADING</text>
    <g>
      <rect x="540" y="151" width="22" height="10" fill="#D97757"><animate attributeName="opacity" values="1;0.2;0.2;0.2;1" dur="1.5s" repeatCount="indefinite"/></rect>
      <rect x="568" y="151" width="22" height="10" fill="#D97757"><animate attributeName="opacity" values="0.2;1;0.2;0.2;0.2" dur="1.5s" repeatCount="indefinite"/></rect>
      <rect x="596" y="151" width="22" height="10" fill="#D97757"><animate attributeName="opacity" values="0.2;0.2;1;0.2;0.2" dur="1.5s" repeatCount="indefinite"/></rect>
      <rect x="624" y="151" width="22" height="10" fill="#D97757"><animate attributeName="opacity" values="0.2;0.2;0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/></rect>
      <rect x="652" y="151" width="22" height="10" fill="#21262d"/>
    </g>
    <text x="798" y="160" class="mono tiny" text-anchor="end">ETA 2028</text>
  </g>
</svg>
